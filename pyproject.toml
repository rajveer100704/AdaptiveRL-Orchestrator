[project]
name = "adaptive-ai-orchestrator"
version = "0.1.0"
description = "Adaptive RL-Based AI Inference Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "redis>=5.0.4",
    "pydantic-settings>=2.2.1",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.3.2",
    "torch>=2.3.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-propagator-b3>=1.24.0",
    "matplotlib>=3.9.0",

]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
]

